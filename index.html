<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenzy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
        }
        
        .content {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            backdrop-filter: blur(5px);
        }
        
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            margin-bottom: 15px;
        }
        
        h1 {
            margin: 10px 0;
            font-size: 2.5em;
        }
        
        .age {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .follow-me {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .social-icon {
            width: 40px;
            height: 40px;
            transition: transform 0.3s;
        }
        
        .social-icon:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <video autoplay muted loop id="video-bg">
        <source src="video.mp4" type="video/mp4">
    </video>
    
    <div class="content">
        <img src="pfp.png" alt="Profile Picture" class="profile-pic">
        <h1>Lenzy</h1>
        <div class="age">15 Years Old</div>
        <div class="follow-me">Follow me</div>
        <div class="social-icons">
            <a href="#" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord" class="social-icon"></a>
            <a href="#" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670147.png" alt="YouTube" class="social-icon"></a>
            <a href="#" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670150.png" alt="Snapchat" class="social-icon"></a>
            <a href="#" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046126.png" alt="TikTok" class="social-icon"></a>
        </div>
    </div>

    <script>
        // Auto-play the video with sound (may be restricted by browsers)
        document.getElementById('video-bg').play();
    </script>
</body>
</html>
